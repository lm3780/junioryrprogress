<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #37352f;
}

.card {
  width: 100%;
  max-width: 560px;
  padding: 18px 20px;
  border: 1px solid rgba(55,53,47,.12);
  border-radius: 14px;
  background: rgba(255,255,255,.72);
  box-shadow: 0 2px 10px rgba(0,0,0,.04);
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.title {
  font-weight: 700;
  font-size: 16px;
}

.percent {
  font-weight: 700;
  font-size: 15px;
}

.week {
  font-size: 13px;
  color: rgba(55,53,47,.62);
  margin: 7px 0 12px;
}

.bar {
  height: 10px;
  width: 100%;
  background: rgba(55,53,47,.10);
  border-radius: 999px;
  overflow: hidden;
}

.fill {
  height: 100%;
  background: #37352f;
  border-radius: 999px;
}

.dates {
  display: flex;
  justify-content: space-between;
  margin-top: 9px;
  font-size: 11px;
  color: rgba(55,53,47,.50);
}
</style>
</head>

<body>

<div class="card">

  <div class="top">
    <div class="title">📚 SCHOOL YEAR · 2026–2027</div>
    <div class="percent" id="percent"></div>
  </div>

  <div class="week" id="week"></div>

  <div class="bar">
    <div class="fill" id="fill"></div>
  </div>

  <div class="dates">
    <span>Aug 10, 2026</span>
    <span>May 27, 2027</span>
  </div>

</div>

<script>

const start = new Date("2026-08-10T00:00:00");
const end = new Date("2027-05-27T23:59:59");
const today = new Date();

const total = end - start;
const elapsed = today - start;

let progress = elapsed / total;

progress = Math.min(1, Math.max(0, progress));

const percent = Math.round(progress * 100);

const totalDays = Math.ceil(total / 86400000);
const daysPassed = Math.max(
  0,
  Math.floor(elapsed / 86400000)
);

const totalWeeks = Math.ceil(totalDays / 7);

const week = Math.min(
  totalWeeks,
  Math.floor(daysPassed / 7) + 1
);

document.getElementById("percent").textContent =
  percent + "%";

document.getElementById("week").textContent =
  "Week " + week + " of " + totalWeeks;

document.getElementById("fill").style.width =
  percent + "%";

</script>

</body>
</html>
