<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #ffffff;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #2f2f2f;
  display: flex;
  align-items: center;
  justify-content: flex-start;
}

/* MAIN PROGRESS CARD */
.card {
  width: 100%;
  max-width: 430px;
  height: 58px;

  padding: 9px 14px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;

  background: #ffffff;

  border: 1px solid #2f2f2f;
  border-radius: 21px;

  overflow: hidden;
}

/* LEFT SIDE */
.info {
  min-width: 100px;
  flex-shrink: 0;
}

.title {
  font-size: 13px;
  font-weight: 650;
  line-height: 16px;
  white-space: nowrap;
}

.week {
  margin-top: 1px;
  font-size: 10px;
  color: #777777;
  line-height: 13px;
  white-space: nowrap;
}

/* RIGHT SIDE */
.progress-area {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.bar {
  flex: 1;
  min-width: 70px;
  height: 6px;

  background: #e8e8e8;

  border-radius: 999px;
  overflow: hidden;
}

.fill {
  height: 100%;
  width: 0%;

  background: #2f2f2f;

  border-radius: 999px;

  transition: width 0.4s ease;
}

.percent {
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 650;
  min-width: 25px;
  text-align: right;
}
</style>
</head>

<body>

<div class="card">

  <div class="info">
    <div class="title">
      📚 School Year
    </div>

    <div class="week" id="week">
      Week 1 / 42
    </div>
  </div>

  <div class="progress-area">

    <div class="bar">
      <div class="fill" id="fill"></div>
    </div>

    <div class="percent" id="percent">
      0%
    </div>

  </div>

</div>

<script>

const start = new Date("2026-08-10T00:00:00");
const end = new Date("2027-05-27T23:59:59");
const today = new Date();

const total = end - start;
const elapsed = today - start;

let progress = elapsed / total;

progress = Math.min(1, Math.max(0, progress));

const percent = Math.round(progress * 100);

const totalDays = Math.ceil(total / 86400000);

const daysPassed = Math.max(
  0,
  Math.floor(elapsed / 86400000)
);

const totalWeeks = Math.ceil(totalDays / 7);

const week = Math.min(
  totalWeeks,
  Math.floor(daysPassed / 7) + 1
);

document.getElementById("week").textContent =
  "Week " + week + " / " + totalWeeks;

document.getElementById("percent").textContent =
  percent + "%";

document.getElementById("fill").style.width =
  percent + "%";

</script>

</body>
</html>
