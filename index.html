<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School Year Progress</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: transparent;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: #2f2f2f;

  padding: 4px;
}


/* =========================
   MAIN CARD
   ========================= */

.card {

  width: 100%;

  max-width: 600px;

  min-height: 86px;

  padding: 16px 20px;

  background: #ffffff;

  border: 1px solid #2f2f2f;

  border-radius: 28px;

  box-shadow: none;

}


/* =========================
   TOP ROW
   ========================= */

.top {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 12px;

}


.title {

  font-size: 15px;

  font-weight: 650;

  letter-spacing: -0.01em;

}


.percent {

  font-size: 15px;

  font-weight: 650;

}


/* =========================
   WEEK TEXT
   ========================= */

.week {

  margin-top: 4px;

  margin-bottom: 11px;

  font-size: 12px;

  color: #777777;

}


/* =========================
   PROGRESS BAR
   ========================= */

.bar {

  width: 100%;

  height: 7px;

  background: #e9e9e9;

  border-radius: 999px;

  overflow: hidden;

}


.fill {

  height: 100%;

  width: 0%;

  background: #2f2f2f;

  border-radius: 999px;

  transition: width 0.4s ease;

}


/* =========================
   DATE ROW
   ========================= */

.dates {

  display: flex;

  justify-content: space-between;

  margin-top: 7px;

  font-size: 9px;

  color: #999999;

}

</style>
</head>


<body>


<div class="card">


  <div class="top">

    <div class="title">
      📚 SCHOOL YEAR · 2026–2027
    </div>

    <div
      class="percent"
      id="percent">
      0%
    </div>

  </div>


  <div
    class="week"
    id="week">

    Week 1 of 42

  </div>


  <div class="bar">

    <div
      class="fill"
      id="fill">
    </div>

  </div>


  <div class="dates">

    <span>
      Aug 10, 2026
    </span>

    <span>
      May 27, 2027
    </span>

  </div>


</div>


<script>


/* =========================
   SCHOOL YEAR DATES
   ========================= */

const start =
  new Date("2026-08-10T00:00:00");


const end =
  new Date("2027-05-27T23:59:59");


const today =
  new Date();


/* =========================
   CALCULATE PROGRESS
   ========================= */

const total =
  end - start;


const elapsed =
  today - start;


let progress =
  elapsed / total;


/* Keep percentage between 0% and 100% */

progress =
  Math.min(
    1,
    Math.max(
      0,
      progress
    )
  );


const percent =
  Math.round(
    progress * 100
  );


/* =========================
   CALCULATE WEEK
   ========================= */

const totalDays =
  Math.ceil(
    total / 86400000
  );


const daysPassed =
  Math.max(
    0,
    Math.floor(
      elapsed / 86400000
    )
  );


const totalWeeks =
  Math.ceil(
    totalDays / 7
  );


const week =
  Math.min(
    totalWeeks,
    Math.floor(
      daysPassed / 7
    ) + 1
  );


/* =========================
   DISPLAY RESULTS
   ========================= */

document
  .getElementById("percent")
  .textContent =
  percent + "%";


document
  .getElementById("week")
  .textContent =
  "Week " +
  week +
  " of " +
  totalWeeks;


/* =========================
   FILL PROGRESS BAR
   ========================= */

document
  .getElementById("fill")
  .style.width =
  percent + "%";


</script>

</body>
</html>
