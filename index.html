<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #2f2f2f;
  padding: 2px;
}

/* THE BUTTON */
.card {
  width: 100%;
  max-width: 420px;
  height: 40px;

  padding: 0 14px;

  display: flex;
  align-items: center;
  gap: 12px;

  background: #ffffff;

  border: 1px solid #2f2f2f;
  border-radius: 999px;

  box-shadow: none;
}

/* TITLE */
.title {
  white-space: nowrap;
  font-size: 13px;
  font-weight: 600;
}

/* WEEK */
.week {
  white-space: nowrap;
  font-size: 11px;
  color: #777777;
}

/* BAR */
.bar {
  flex: 1;
  min-width: 60px;
  height: 6px;

  background: #e8e8e8;

  border-radius: 999px;
  overflow: hidden;
}

/* FILLED PART */
.fill {
  height: 100%;
  width: 0%;

  background: #2f2f2f;

  border-radius: 999px;

  transition: width .4s ease;
}

/* PERCENT */
.percent {
  white-space: nowrap;
  font-size: 12px;
  font-weight: 600;
}
</style>
</head>

<body>

<div class="card">

  <div class="title">
    📚 School Year
  </div>

  <div class="week" id="week">
    Week 1 / 42
  </div>

  <div class="bar">
    <div class="fill" id="fill"></div>
  </div>

  <div class="percent" id="percent">
    0%
  </div>

</div>

<script>

const start =
  new Date("2026-08-10T00:00:00");

const end =
  new Date("2027-05-27T23:59:59");

const today =
  new Date();

const total =
  end - start;

const elapsed =
  today - start;

let progress =
  elapsed / total;

progress =
  Math.min(
    1,
    Math.max(
      0,
      progress
    )
  );

const percent =
  Math.round(
    progress * 100
  );

const totalDays =
  Math.ceil(
    total / 86400000
  );

const daysPassed =
  Math.max(
    0,
    Math.floor(
      elapsed / 86400000
    )
  );

const totalWeeks =
  Math.ceil(
    totalDays / 7
  );

const week =
  Math.min(
    totalWeeks,
    Math.floor(
      daysPassed / 7
    ) + 1
  );

document
  .getElementById("week")
  .textContent =
  "Week " +
  week +
  " / " +
  totalWeeks;

document
  .getElementById("percent")
  .textContent =
  percent + "%";

document
  .getElementById("fill")
  .style.width =
  percent + "%";

</script>

</body>
</html>
